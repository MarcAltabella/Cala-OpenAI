services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cala
      POSTGRES_PASSWORD: cala
      POSTGRES_DB: cala
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cala -d cala"]
      interval: 5s
      timeout: 5s
      retries: 10
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/cala-demo
    ports: ["7474:7474", "7687:7687"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p cala-demo 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
